name: Release protoc-gen-typescript-http

on:
  push:
    tags:
      - 'protoc-gen-typescript-http/v*'

permissions:
  contents: write

env:
  CGO_ENABLED: 0

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: protoc-gen-typescript-http/go.mod
          cache-dependency-path: protoc-gen-typescript-http/go.sum

      - name: Setup buf
        uses: ./.github/actions/setup-buf

      # 同 dart-http:本模块只有 TestGoldenExamples 一个用例,缺 buf 就自行 t.Skip,
      # 于是 `go test ./...` 恒绿。装 buf + 要求该用例真的 PASS 才是门禁。
      # -count=1 堵住 Go 的跨 run 测试缓存(测试二进制不链接生成器代码)。
      - name: Test
        working-directory: protoc-gen-typescript-http
        shell: bash
        env:
          GOWORK: off
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/ts-http-test.log"
          go test -count=1 -v ./... 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::go test 失败(rc=$rc)"
            exit "$rc"
          fi
          if ! grep -q -- '--- PASS: TestGoldenExamples' "$log"; then
            echo '::error::TestGoldenExamples 未 PASS:被跳过(buf 不在 PATH)或基线漂移,门禁已失效'
            exit 1
          fi

  build:
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ''
          - goos: linux
            goarch: arm64
            suffix: ''
          - goos: windows
            goarch: amd64
            suffix: '.exe'
          - goos: windows
            goarch: arm64
            suffix: '.exe'
          - goos: darwin
            goarch: amd64
            suffix: ''
          - goos: darwin
            goarch: arm64
            suffix: ''

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: protoc-gen-typescript-http/go.mod
          cache-dependency-path: protoc-gen-typescript-http/go.sum

      - name: Extract version
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#protoc-gen-typescript-http/}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: protoc-gen-typescript-http
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags="-s -w" \
            -o "../build/protoc-gen-typescript-http-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}" \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: protoc-gen-typescript-http-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/protoc-gen-typescript-http-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#protoc-gen-typescript-http/}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --list 'protoc-gen-typescript-http/v*' --sort=-version:refname | head -2 | tail -1)
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD" -- protoc-gen-typescript-http/ || true)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" HEAD -- protoc-gen-typescript-http/ || true)
          fi
          echo "changes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: build/
          merge-multiple: true

      - name: Create checksums
        working-directory: build/
        run: |
          sha256sum * > ../checksums.txt
          mv ../checksums.txt checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "protoc-gen-typescript-http ${{ steps.version.outputs.version }}"
          body: |
            ## Changes
            ${{ steps.changelog.outputs.changes }}

            ## Downloads
            | File | OS | Arch |
            |------|----|------|
            | `protoc-gen-typescript-http-linux-amd64` | Linux | x86_64 |
            | `protoc-gen-typescript-http-linux-arm64` | Linux | ARM64 |
            | `protoc-gen-typescript-http-windows-amd64.exe` | Windows | x86_64 |
            | `protoc-gen-typescript-http-windows-arm64.exe` | Windows | ARM64 |
            | `protoc-gen-typescript-http-darwin-amd64` | macOS | x86_64 |
            | `protoc-gen-typescript-http-darwin-arm64` | macOS | ARM64 |
          files: |
            build/*
