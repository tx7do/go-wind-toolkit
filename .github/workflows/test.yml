name: Test

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go 测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    env:
      # 逐模块构建,不能让任何杂散 go.work 参与(protoc-gen-go-http/go.work 就是
      # 一个残留的坏文件,use 了 190 个不存在的目录)。goldentest.goBuild 里
      # 已经用同样的手段隔离宿主 go.work。
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          # 取各模块里最高的 go 指令要求(gowind-uiapp 1.25.6)
          go-version-file: gowind-uiapp/go.mod
          cache-dependency-path: '**/go.sum'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gowind-uiapp/frontend/package-lock.json

      # main.go 里的 //go:embed all:frontend/dist 要求真实产物,而 frontend/dist 不入库
      # (.gitignore)。checkout 后直接 go build gowind-uiapp 会报
      # "pattern all:frontend/dist: no matching files found",所以 Go 之前必须先出前端。
      # 这里只跑 vite,类型检查有独立的 frontend-typecheck job,不重复。
      #
      # max-old-space-size:macos runner 上 vite build 会在
      # "FATAL ERROR: Ineffective mark-compacts near heap limit" 处 OOM(ubuntu 不会)。
      # 本地用 --max-old-space-size=512 可稳定复现该崩溃,4096 则 26s 构建完成。
      - name: Build frontend assets
        working-directory: gowind-uiapp/frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm ci
          npx vite build

      # goldentest.Run 在 PATH 里找不到 buf 就自行跳过,不装 buf 就拦不住 protoc-gen-dart-http
      # / protoc-gen-typescript-http 的生成物漂移(基线曾在 d0c6e90 之后一直是旧的而无人察觉)。
      # 版本钉死:输出里注释段落的形态取决于 buf 对 LeadingComments 的归一化,buf 版本漂移
      # 会让 golden 无故转红;1.66.0 与本地生成基线时用的版本一致。
      # 副作用:examples/proto/buf.yaml 依赖 buf.build/googleapis/googleapis,所以这一步
      # 之后 job 需要能访问 BSR —— 拉不到时先怀疑网络而不是生成器。
      - name: Setup buf
        shell: bash
        env:
          BUF_VERSION: '1.66.0'
        run: |
          # 发布产物文件名就是 "<uname -s>-<uname -m>"(Darwin-arm64 / Linux-x86_64),
          # 直接拼即可,arch 无需再映射(macos 是 arm64、ubuntu 是 x86_64)。
          dest="$RUNNER_TEMP/buf"
          mkdir -p "$dest"
          curl -fsSL "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-$(uname -s)-$(uname -m).tar.gz" \
            | tar -xz -C "$dest" buf/bin/buf
          chmod +x "$dest/buf/bin/buf"
          echo "$dest/buf/bin" >> "$GITHUB_PATH"
          buf --version

      # 本仓库是多个独立 Go 模块,没有 go.work 把它们串起来,故逐模块跑。
      # 只取仓库根下一层的 go.mod,自动排除 .sage/、examples/ 等嵌套模块。
      - name: Build, vet and test each module
        shell: bash
        run: |
          set -uo pipefail

          # 已知失败豁免:TestRepoClone 真连网 clone go-kratos/service-layout 到
          # $HOME/.kratos,ubuntu runner 报 "stat .../objects/maintenance.lock: no such
          # file or directory";本机换冷 HOME 仍绿,是 runner 差异而非本轮回归,待单独排查。
          # 早先同批豁免的 3 条 TestGenerate_* 已修复,不要再加回来。
          SKIP_GOWIND='^TestRepoClone$'

          # 没有上面那步 Setup buf,protoc-gen-dart-http / protoc-gen-typescript-http 的
          # golden 回归会静默跳过、只剩普通单测。
          #
          # -count=1 是这条门禁的有效性所在,不是性能选项:golden 测试的测试二进制并不链接
          # 生成器代码(goldentest 在运行时才 go build 出插件再 buf generate),所以只改生成器
          # 时测试二进制哈希不变,Go 会直接复用缓存里的 PASS。实测把 codegen.CommentLines
          # 改坏后 `go test ./...` 仍报 "ok (cached)",加 -count=1 才 FAIL。
          # actions/setup-go 会跨 run 缓存测试结果,所以 CI 上同样会被骗过去。

          failed=""
          for mod in */go.mod; do
            dir="$(dirname "$mod")"
            echo "::group::$dir"
            if [ "$dir" = "gowind" ]; then
              ( cd "$dir" && go build ./... && go vet ./... \
                && go test -count=1 -skip "$SKIP_GOWIND" ./... )
            else
              ( cd "$dir" && go build ./... && go vet ./... && go test -count=1 ./... )
            fi
            status=$?
            echo "::endgroup::"
            if [ $status -ne 0 ]; then
              failed="$failed $dir"
            fi
          done

          if [ -n "$failed" ]; then
            echo "::error::失败模块:$failed"
            exit 1
          fi
          echo "全部模块通过"

  frontend-typecheck:
    name: 前端类型检查
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gowind-uiapp/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: gowind-uiapp/frontend
        run: npm ci

      # 前端没有测试运行器,vue-tsc 是目前唯一能拦住 GUI 类型回归的门禁。
      - name: Type check
        working-directory: gowind-uiapp/frontend
        run: npx vue-tsc --noEmit
