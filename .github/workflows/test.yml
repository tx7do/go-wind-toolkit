name: Test

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go 测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    env:
      # 本仓库是若干互相独立的 Go 模块。GOWORK=off 保证任何杂散 workspace——开发者
      # 自己建的、或落在上层目录的——都不会把模块串起来改变构建语义(goldentest.goBuild
      # 与各模块 Makefile 用同样手段)。
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          # 取各模块里最高的 go 指令要求(gowind-uiapp 1.25.6)
          go-version-file: gowind-uiapp/go.mod
          cache-dependency-path: '**/go.sum'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gowind-uiapp/frontend/package-lock.json

      # main.go 里的 //go:embed all:frontend/dist 要求真实产物,而 frontend/dist 不入库
      # (.gitignore)。checkout 后直接 go build gowind-uiapp 会报
      # "pattern all:frontend/dist: no matching files found",所以 Go 之前必须先出前端。
      # 这里只跑 vite,类型检查有独立的 frontend-typecheck job,不重复。
      #
      # max-old-space-size:macos runner 上 vite build 会在
      # "FATAL ERROR: Ineffective mark-compacts near heap limit" 处 OOM(ubuntu 不会)。
      # 本地用 --max-old-space-size=512 可稳定复现该崩溃,4096 则 26s 构建完成。
      - name: Build frontend assets
        working-directory: gowind-uiapp/frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm ci
          npx vite build

      # goldentest.Run 在 PATH 里找不到 buf 就自行跳过,不装 buf 就拦不住 protoc-gen-dart-http
      # / protoc-gen-typescript-http 的生成物漂移(基线曾在 d0c6e90 之后一直是旧的而无人察觉)。
      # 版本钉死:输出里注释段落的形态取决于 buf 对 LeadingComments 的归一化,buf 版本漂移
      # 会让 golden 无故转红;1.66.0 与本地生成基线时用的版本一致。
      # 副作用:examples/proto/buf.yaml 依赖 buf.build/googleapis/googleapis,所以这一步
      # 之后 job 需要能访问 BSR —— 拉不到时先怀疑网络而不是生成器。
      - name: Setup buf
        shell: bash
        env:
          BUF_VERSION: '1.66.0'
        run: |
          # 发布产物文件名就是 "<uname -s>-<uname -m>"(Darwin-arm64 / Linux-x86_64),
          # 直接拼即可,arch 无需再映射(macos 是 arm64、ubuntu 是 x86_64)。
          dest="$RUNNER_TEMP/buf"
          mkdir -p "$dest"
          curl -fsSL "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-$(uname -s)-$(uname -m).tar.gz" \
            | tar -xz -C "$dest" buf/bin/buf
          chmod +x "$dest/buf/bin/buf"
          echo "$dest/buf/bin" >> "$GITHUB_PATH"
          # 按绝对路径自检:$GITHUB_PATH 只对后续 step 生效,同一步里 buf 仍不在 PATH 上。
          # 首轮 CI 就是在这行 exit 127(command not found),下载与解压其实都成功了。
          "$dest/buf/bin/buf" --version

      # 本仓库是多个独立 Go 模块,没有 go.work 把它们串起来,故逐模块跑。
      # 只取仓库根下一层的 go.mod,自动排除 .sage/、examples/ 等嵌套模块。
      - name: Build, vet and test each module
        shell: bash
        run: |
          set -uo pipefail

          # 已知失败豁免:TestRepoClone 只在 ubuntu runner 上红,macos 与本机等价环境下都绿。
          # 日志定位(run 35483391871 job 106005145159):报错点是 repo_test.go 的 CopyTo,
          # 顺序为 clone 成功 → CopyTo 内部再 Clone 时缓存已存在 → 走 git pull →
          # "Already up to date." 之后报
          # "stat ~/.kratos/repo/.../.git/objects/maintenance.lock: no such file or directory"。
          # 即 git 2.55 在 pull 收尾触发的 auto-maintenance(git-config: maintenance.auto 默认
          # true、maintenance.autoDetach 默认 true=后台分离进程)与 runner 上的锁文件竞争,
          # 不是本项目回归。测试本身已改为用临时 HOME(clone 冷缓存、落地目录进 t.TempDir()),
          # 换冷 HOME 也不是差异点——runner 每次本来就是冷缓存。
          # 想撤掉这条豁免只剩两条路,都得在 ubuntu 上实测:给子进程注入
          # GIT_CONFIG_COUNT/KEY_0=maintenance.auto/VALUE_0=false,或忍着一个偶发红。
          SKIP_GOWIND='^TestRepoClone$'

          # 没有上面那步 Setup buf,protoc-gen-dart-http / protoc-gen-typescript-http 的
          # golden 回归会静默跳过、只剩普通单测。
          #
          # -count=1 是这条门禁的有效性所在,不是性能选项:golden 测试的测试二进制并不链接
          # 生成器代码(goldentest 在运行时才 go build 出插件再 buf generate),所以只改生成器
          # 时测试二进制哈希不变,Go 会直接复用缓存里的 PASS。实测把 codegen.CommentLines
          # 改坏后 `go test ./...` 仍报 "ok (cached)",加 -count=1 才 FAIL。
          # actions/setup-go 会跨 run 缓存测试结果,所以 CI 上同样会被骗过去。

          failed=""
          for mod in */go.mod; do
            dir="$(dirname "$mod")"
            echo "::group::$dir"
            if [ "$dir" = "gowind" ]; then
              ( cd "$dir" && go build ./... && go vet ./... \
                && go test -count=1 -skip "$SKIP_GOWIND" ./... )
            else
              ( cd "$dir" && go build ./... && go vet ./... && go test -count=1 ./... )
            fi
            status=$?
            echo "::endgroup::"
            if [ $status -ne 0 ]; then
              failed="$failed $dir"
            fi
          done

          if [ -n "$failed" ]; then
            echo "::error::失败模块:$failed"
            exit 1
          fi
          echo "全部模块通过"

  # sqlkratos 有两条连库用例,矩阵作业里(无 MySQL)一律跳过,等于这条路没有门禁:
  # TestGenerate_GenerateOnlyProto 连空的 test 库,TestGenerate_MySQLSeededTable 自建
  # 专用库 gowind_sqlkratos_it、建一张 users 表,再断言生成的是 user.proto 且列映射成
  # int64 id / string name。前者只到"拨号+认证+空表集不报错"(Generate 在
  # len(tables)==0 就返回),后者才真正覆盖 information_schema 探测到 proto 的映射。
  #
  # 单独一个 ubuntu 作业而不是给矩阵加 services:GitHub 的 service container 只支持
  # Linux runner,macOS 上 job 会直接以
  # "Error: Container operations are only supported on Linux runners" 起不来。
  #
  # 凭据与测试常量对齐:generate_test.go 的 testMySQLAddr=127.0.0.1:3306、管理员连接
  # root:pass。端口映射到 127.0.0.1 才能被宿主机侧的 net.Dial 探到。建库需要
  # CREATE/DROP DATABASE 权限,这里用 root;开发者本机密码不同时用
  # GOWIND_TEST_MYSQL_ROOT_DSN 覆盖,不要用豁免把用例改回跳过。
  #
  # 这里只跑 pkg/sqlkratos 一个包:同包的 TestGenerate_MySQL_DDL 断言"连不上库时报
  # dial tcp",有真库时它按设计跳过,而它在矩阵作业里(无库)是真跑的——两条用例跨作业
  # 合起来才全覆盖,不要把这里当唯一来源。
  go-test-mysql:
    name: Go 测试 (ubuntu + MySQL)
    runs-on: ubuntu-latest

    env:
      GOWORK: 'off'

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: pass
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: gowind-uiapp/go.mod
          cache-dependency-path: '**/go.sum'

      # 同矩阵作业:-count=1 防 Go 测试结果缓存;TestRepoClone 不在本包路径里,这个
      # -skip 是防着将来把范围放宽到 ./... 时把已知红放进来。
      # -v:这个作业的价值就在于"连库用例真的跑了",没有 -v 时跳过与通过都只打印一行
      # ok,日志分不出来。
      - name: Test sqlkratos against a real MySQL
        shell: bash
        working-directory: gowind
        run: |
          set -uo pipefail
          go build ./... && go vet ./...
          go test -count=1 -v -skip '^TestRepoClone$' ./pkg/sqlkratos/...

  frontend-typecheck:
    name: 前端类型检查
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gowind-uiapp/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: gowind-uiapp/frontend
        run: npm ci

      # 前端没有测试运行器,vue-tsc 是目前唯一能拦住 GUI 类型回归的门禁。
      - name: Type check
        working-directory: gowind-uiapp/frontend
        run: npx vue-tsc --noEmit
