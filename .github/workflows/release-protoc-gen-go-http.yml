name: Release protoc-gen-go-http

on:
  push:
    tags:
      - 'protoc-gen-go-http/v*'

permissions:
  contents: write

env:
  CGO_ENABLED: 0

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: protoc-gen-go-http/go.mod
          cache-dependency-path: protoc-gen-go-http/go.sum

      - name: Test
        working-directory: protoc-gen-go-http
        env:
          GOWORK: off
        # 本模块的用例是纯内存单测(不依赖 buf),门禁本身有效;加 -count=1 只是堵住
        # actions/setup-go 跨 run 的测试结果缓存,与 test.yml 同一口径。
        run: go build ./... && go vet ./... && go test -count=1 ./...

  build:
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ''
          - goos: linux
            goarch: arm64
            suffix: ''
          - goos: windows
            goarch: amd64
            suffix: '.exe'
          - goos: windows
            goarch: arm64
            suffix: '.exe'
          - goos: darwin
            goarch: amd64
            suffix: ''
          - goos: darwin
            goarch: arm64
            suffix: ''

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: protoc-gen-go-http/go.mod
          cache-dependency-path: protoc-gen-go-http/go.sum

      - name: Extract version
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#protoc-gen-go-http/}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: protoc-gen-go-http
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags="-s -w" \
            -o "../build/protoc-gen-go-http-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}" \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: protoc-gen-go-http-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/protoc-gen-go-http-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#protoc-gen-go-http/}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --list 'protoc-gen-go-http/v*' --sort=-version:refname | head -2 | tail -1)
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD" -- protoc-gen-go-http/ || true)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" HEAD -- protoc-gen-go-http/ || true)
          fi
          echo "changes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: build/
          merge-multiple: true

      - name: Create checksums
        working-directory: build/
        run: |
          sha256sum * > ../checksums.txt
          mv ../checksums.txt checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "protoc-gen-go-http ${{ steps.version.outputs.version }}"
          body: |
            ## Changes
            ${{ steps.changelog.outputs.changes }}

            ## Downloads
            | File | OS | Arch |
            |------|----|------|
            | `protoc-gen-go-http-linux-amd64` | Linux | x86_64 |
            | `protoc-gen-go-http-linux-arm64` | Linux | ARM64 |
            | `protoc-gen-go-http-windows-amd64.exe` | Windows | x86_64 |
            | `protoc-gen-go-http-windows-arm64.exe` | Windows | ARM64 |
            | `protoc-gen-go-http-darwin-amd64` | macOS | x86_64 |
            | `protoc-gen-go-http-darwin-arm64` | macOS | ARM64 |
          files: |
            build/*
