name: Release protoc-gen-dart-http

on:
  push:
    tags:
      - 'protoc-gen-dart-http/v*'

permissions:
  contents: write

env:
  CGO_ENABLED: 0

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: protoc-gen-dart-http/go.mod
          cache-dependency-path: protoc-gen-dart-http/go.sum

      - name: Setup buf
        uses: ./.github/actions/setup-buf

      # 本模块只有 TestGoldenExamples 一个用例,而 goldentest.Run 找不到 buf 就自行 t.Skip:
      # 不装 buf、又不显式要求它 PASS,这个 job 会恒绿,等于发布没有门禁。
      # -count=1 不是性能选项:golden 测试二进制并不链接生成器代码(生成器是运行时才
      # go build 出来的),只改生成器时哈希不变,Go 会把缓存里的旧 PASS 直接端上来。
      - name: Test
        working-directory: protoc-gen-dart-http
        shell: bash
        env:
          GOWORK: off
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/dart-http-test.log"
          go test -count=1 -v ./... 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::go test 失败(rc=$rc)"
            exit "$rc"
          fi
          if ! grep -q -- '--- PASS: TestGoldenExamples' "$log"; then
            echo '::error::TestGoldenExamples 未 PASS:被跳过(buf 不在 PATH)或基线漂移,门禁已失效'
            exit 1
          fi

  build:
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ''
          - goos: linux
            goarch: arm64
            suffix: ''
          - goos: windows
            goarch: amd64
            suffix: '.exe'
          - goos: windows
            goarch: arm64
            suffix: '.exe'
          - goos: darwin
            goarch: amd64
            suffix: ''
          - goos: darwin
            goarch: arm64
            suffix: ''

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: protoc-gen-dart-http/go.mod
          cache-dependency-path: protoc-gen-dart-http/go.sum

      - name: Extract version
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#protoc-gen-dart-http/}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: protoc-gen-dart-http
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags="-s -w" \
            -o "../build/protoc-gen-dart-http-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}" \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: protoc-gen-dart-http-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/protoc-gen-dart-http-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#protoc-gen-dart-http/}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --list 'protoc-gen-dart-http/v*' --sort=-version:refname | head -2 | tail -1)
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD" -- protoc-gen-dart-http/ || true)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" HEAD -- protoc-gen-dart-http/ || true)
          fi
          echo "changes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: build/
          merge-multiple: true

      - name: Create checksums
        working-directory: build/
        run: |
          sha256sum * > ../checksums.txt
          mv ../checksums.txt checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "protoc-gen-dart-http ${{ steps.version.outputs.version }}"
          body: |
            ## Changes
            ${{ steps.changelog.outputs.changes }}

            ## Downloads
            | File | OS | Arch |
            |------|----|------|
            | `protoc-gen-dart-http-linux-amd64` | Linux | x86_64 |
            | `protoc-gen-dart-http-linux-arm64` | Linux | ARM64 |
            | `protoc-gen-dart-http-windows-amd64.exe` | Windows | x86_64 |
            | `protoc-gen-dart-http-windows-arm64.exe` | Windows | ARM64 |
            | `protoc-gen-dart-http-darwin-amd64` | macOS | x86_64 |
            | `protoc-gen-dart-http-darwin-arm64` | macOS | ARM64 |
          files: |
            build/*
