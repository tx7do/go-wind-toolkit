name: Release protoc-gen-go-redact

on:
  push:
    tags:
      - 'protoc-gen-go-redact/v*'

permissions:
  contents: write

env:
  CGO_ENABLED: 0

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: protoc-gen-go-redact/go.mod
          cache-dependency-path: protoc-gen-go-redact/go.sum

      - name: Test
        working-directory: protoc-gen-go-redact
        env:
          GOWORK: off
        # 说明:integration_test.go / external_template_test.go 在 PATH 缺 protoc 时自行
        # t.Skip(runner 上没有 protoc),所以这两条在发布链上是跳过的——本 job 的有效性
        # 来自其余单测。不在此处按"有 SKIP 即红"收口,否则 apt 装的 protoc 版本一漂移就会
        # 把发布无故拦红;要让这两条入闸,请像 test.yml 钉 buf 那样先钉 protoc 版本。
        # -count=1 与 test.yml 同一口径,堵跨 run 的测试结果缓存。
        run: go build ./... && go vet ./... && go test -count=1 ./...

  build:
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ''
          - goos: linux
            goarch: arm64
            suffix: ''
          - goos: windows
            goarch: amd64
            suffix: '.exe'
          - goos: windows
            goarch: arm64
            suffix: '.exe'
          - goos: darwin
            goarch: amd64
            suffix: ''
          - goos: darwin
            goarch: arm64
            suffix: ''

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: protoc-gen-go-redact/go.mod
          cache-dependency-path: protoc-gen-go-redact/go.sum

      - name: Extract version
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#protoc-gen-go-redact/}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: protoc-gen-go-redact
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags="-s -w" \
            -o "../build/protoc-gen-go-redact-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}" \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: protoc-gen-go-redact-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/protoc-gen-go-redact-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#protoc-gen-go-redact/}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --list 'protoc-gen-go-redact/v*' --sort=-version:refname | head -2 | tail -1)
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD" -- protoc-gen-go-redact/ || true)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" HEAD -- protoc-gen-go-redact/ || true)
          fi
          echo "changes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: build/
          merge-multiple: true

      - name: Create checksums
        working-directory: build/
        run: |
          sha256sum * > ../checksums.txt
          mv ../checksums.txt checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "protoc-gen-go-redact ${{ steps.version.outputs.version }}"
          body: |
            ## Changes
            ${{ steps.changelog.outputs.changes }}

            ## Downloads
            | File | OS | Arch |
            |------|----|------|
            | `protoc-gen-go-redact-linux-amd64` | Linux | x86_64 |
            | `protoc-gen-go-redact-linux-arm64` | Linux | ARM64 |
            | `protoc-gen-go-redact-windows-amd64.exe` | Windows | x86_64 |
            | `protoc-gen-go-redact-windows-arm64.exe` | Windows | ARM64 |
            | `protoc-gen-go-redact-darwin-amd64` | macOS | x86_64 |
            | `protoc-gen-go-redact-darwin-arm64` | macOS | ARM64 |
          files: |
            build/*
